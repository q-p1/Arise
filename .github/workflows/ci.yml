name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test (fuzzes every generator, checks content + scheduler)
        run: npm test
      - name: Build
        run: npm run build
      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html is out of date — run 'npm run build' and commit the result."
            git diff --stat -- index.html
            exit 1
          fi
