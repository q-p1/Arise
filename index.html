/* ── Typography ───────────────────────────────────────────────
   Arise is an Arabic-first product whose screens constantly mix Arabic UI
   with English exam content (analogies, grammar, AWL vocabulary). It used to
   ship no webfont at all — `Tahoma, system-ui` — so it rendered as a different
   product on every OS and leaned on a 1990s fallback face for Arabic.

   IBM Plex Sans Arabic (SIL OFL 1.1) is a purpose-designed Arabic UI typeface
   drawn as a matched pair with IBM Plex Sans Latin, so both scripts share
   metrics, colour and voice on the same line. Self-hosted so the PWA stays
   fully offline. Two files per script: the weight ranges below map 600-900
   straight onto Bold, keeping the design's heavy headings crisp and stopping
   browsers from smearing on a synthetic bold.
   ───────────────────────────────────────────────────────────── */
@font-face{font-family:'IBM Plex Sans Arabic';font-style:normal;font-weight:400 500;font-display:swap;
  src:url(./fonts/plex-ar-arabic-400.woff2) format('woff2');
  unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:'IBM Plex Sans Arabic';font-style:normal;font-weight:600 900;font-display:swap;
  src:url(./fonts/plex-ar-arabic-700.woff2) format('woff2');
  unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:'IBM Plex Sans Arabic';font-style:normal;font-weight:400 500;font-display:swap;
  src:url(./fonts/plex-ar-latin-400.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'IBM Plex Sans Arabic';font-style:normal;font-weight:600 900;font-display:swap;
  src:url(./fonts/plex-ar-latin-700.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
html,body{margin:0;background:#0F5147}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0F5147;color:#fff;font-family:'IBM Plex Sans Arabic',Tahoma,system-ui;z-index:99;transition:opacity .4s}
#splash svg{width:92px;height:92px}
#splash div{margin-top:14px;font-weight:800;letter-spacing:8px;font-size:22px}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
#splash *{animation:rise .6s ease}
</style>

e passage is that:",options:["studying all night is best","sleep strengthens memory","exams are unfair","seven hours is too much"],a:1,ex:"consolidates = \u064A\u062B\u0628\u0651\u062A \u0627\u0644\u0645\u062A\u0639\u0644\u064E\u0651\u0645\u061B \u0627\u0644\u0641\u0643\u0631\u0629 \u0623\u0646 \u0627\u0644\u0646\u0648\u0645 \u064A\u0642\u0648\u0651\u064A \u0627\u0644\u0630\u0627\u0643\u0631\u0629."},{type:"vocab",q:"The word \xABconsolidates\xBB most nearly means:",options:["erases","strengthens","delays","measures"],a:1,ex:"consolidate = \u064A\u0631\u0633\u0651\u062E \u0648\u064A\u0642\u0648\u0651\u064A \u2014 \u0642\u0631\u064A\u0646\u062A\u0647\u0627 \u0627\u0644\u062A\u0636\u0627\u062F \u0645\u0639 \xABmerely rest\xBB."},{type:"not",q:"Which statement is NOT supported by the passage?",options:["sleep affects recall","all-night study is less effective","sleep has a role beyond rest","seven hours guarantees a perfect score"],a:3,ex:"\u0627\u0644\u0646\u0635 \u064A\u0642\u0648\u0644 \xABrecall more\xBB \u0644\u0627 \xAB\u062F\u0631\u062C\u0629 \u0643\u0627\u0645\u0644\u0629 \u0645\u0636\u0645\u0648\u0646\u0629\xBB \u2014 \u062A\u0639\u0645\u064A\u0645 \u0632\u0627\u0626\u062F."}]},{id:"rd-solar",level:2,text:"Because desert regions receive intense sunlight for most of the year, they are ideal for solar farms. However, dust storms reduce panel efficiency, so frequent cleaning is required.",questions:[{type:"cause",q:"Why is cleaning necessary?",options:["panels are fragile","dust lowers efficiency","sunlight is weak","storms destroy panels"],a:1,ex:"\u0627\u0644\u0646\u0635 \u064A\u0631\u0628\u0637: dust storms \u2190 reduce efficiency \u2190 so cleaning."},{type:"detail",q:"Desert regions suit solar farms because they have:",options:["cheap land","strong sunlight most of the year","no dust","cool weather"],a:1,ex:"\xABintense sunlight for most of the year\xBB \u0633\u0628\u0628 \u0635\u0631\u064A\u062D."},{type:"connector",q:"The word \xABHowever\xBB signals:",op tions:["produces far lower yields","uses about half the water","requires no equipment","increases evaporation"],a:1,ex:"\xABnearly half the water\xBB \u0645\u0639 \xABsimilar yields\xBB."}]},{id:"rd-iot",level:2,text:"Everyday devices \u2014 from watches to refrigerators \u2014 are increasingly connected to the internet. They collect data and share it automatically, letting a home adjust its lighting or temperature before the owner even asks. This convenience, however, comes with a cost: the more data these devices gather, the more questions arise about privacy.",questions:[{type:"main",q:"The passage mainly discusses:",options:["how to repair refrigerators","connected devices and their trade-off","the history of the internet","why watches are popular"],a:1,ex:"\u0627\u0644\u0645\u062D\u0648\u0631: \u0627\u0644\u0623\u062C\u0647\u0632\u0629 \u0627\u0644\u0645\u062A\u0635\u0644\u0629 \u0648\u0631\u0627\u062D\u062A\u0647\u0627 \u0645\u0642\u0627\u0628\u0644 \u0643\u0644\u0641\u062A\u0647\u0627 \u0641\u064A \u0627\u0644\u062E\u0635\u0648\u0635\u064A\u0629."},{type:"pronoun",q:"In the second sentence, \xABThey\xBB refers to:",options:["homes","owners","everyday connected devices","privacy questions"],a:2,ex:"\xABThey\xBB \u062A\u0639\u0648\u062F \u0639\u0644\u0649 \xABEveryday devices \u2026 connected to the internet\xBB."},{type:"connector",q:"The word \xABhowever\xBB signals that the writer is about to mention:",options:["another benefit","a drawback","an example","a conclusion"],a:1,ex:"however \u062A\u064F\u062F\u062E\u0644 \u0627\u0644\u062C\u0627\u0646\u0628 \u0627\u0644\u0633\u0644\u0628\u064A (\u0627\u0644\u0643\u0644\u0641\u0629 \u0639\u0644\u0649 \u0627\u0644\u062E\u0635\u0648\u0635\u064A\u0629) \u0628\u0639\u062F \u0630\u0643\u0631 \u0627\u0644\u0631\u0627\u062D\u0629."},{type:"title",q:"The best title for the passage is:",options:["Convenience at a Price","How to Build a Watch","The End of Privacy","A Guide to Refrigerators"],a:0,ex:"\u0627\u0644\u0639\u0646\u0648\u0627\u0646 \u064A\u0648\u0627\u0632\u0646 \u0628\u064A\u0646 \u0627\u0644\u0631\u0627\u062D\u0629 \u0648\u0643\u0644\u0641\u062A\u0647\u0627 \u2014 \u062C\u0648\u0647\u0631 \u0627\u0644\u0646\u0635."}]},{id:"rd-coral",level:2,text:"Coral reefs shelter roughly a quarter of all marine species, yet they cover less than one percent of the ocean floor. When sea temperatures rise, the corals expel the tiny algae that feed them, leaving the reefs pale and weak \u2014 a process known as bleaching.",questions:[{type:"detail",q:"According to the passage, coral reefs cover:",options:["a quarter of the ocean floor","less than one percent of the ocean floor","half of the ocean","most warm seas"],a:1,ex:"\u0646\u0635 \u0635\u0631\u064A\u062D: \xABless than one percent of the ocean floor\xBB (\u0627\u0644\u0631\u0628\u0639 \u064A\u062E\u0635 \u0627\u0644\u0623\u0646\u0648\u0627\u0639 \u0644\u0627 \u0627\u0644\u0645\u0633\u0627\u062D\u0629)."},{type:"vocab",q:"The word \xABexpel\xBB most nearly means:",options:["welcome","push out","feed","colour"],a:1,ex:"expel = \u064A\u0637\u0631\u062F/\u064A\u064F\u062E\u0631\u062C\u061B \u0627\u0644\u0642\u0631\u064A\u0646\u0629 \u0623\u0646 \u0627\u0644\u0645\u0631\u062C\u0627\u0646 \u064A\u0641\u0642\u062F \u0627\u0644\u0637\u062D\u0627\u0644\u0628."},{type:"cause",q:"Bleaching happens because:",options:["reefs grow too fast","rising temperatures drive out the algae","fish eat the coral","the ocean floor sinks"],a:1,ex:"\u0633\u0644\u0633\u0644\u0629 \u0627\u0644\u0633\u0628\u0628: \u0627\u0631\u062A\u0641\u0627\u0639 \u0627\u0644\u062D\u0631\u0627\u0631\u0629 \u2190 \u0637\u0631\u062F \u0627\u0644\u0637\u062D\u0627\u0644\u0628 \u2190 \u0634\u062D\u0648\u0628 \u0648\u0636\u0639\u0641."},{type:"infer",q:"The passage suggests that coral reefs are:",options:["unimportant to the ocean","ecologically valuable but fragile","growing stronger each year","found only in cold water"],a:1,ex:"\u064A\u0624\u0648\u064A\u0627\u0646 \u0631\u0628\u06
